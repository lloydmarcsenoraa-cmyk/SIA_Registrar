openapi: 3.0.3
info:
  title: RegistrarSys Mock REST API
  version: 1.0.0
  description: Database-free in-memory Registrar module for the SIA College Management System. Data resets
    when the mock server restarts.
servers:
- url: http://localhost:3001
  description: Local mock API
tags:
- name: System
- name: Programs
- name: Students
- name: Enrollments
- name: Courses
- name: Academic Records
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                - status
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
