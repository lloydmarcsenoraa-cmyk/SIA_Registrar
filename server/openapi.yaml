components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          minimum: 100
          example: 400
        detail:
          type: string
          example: Invalid request data
      required:
      - type
      - title
      - status
      - detail
    Program:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        code:
          type: string
          example: BSIT
        name:
          type: string
          example: Bachelor of Science in Information Technology
      required:
      - id
      - code
      - name
    Student:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 4
        studentNumber: &id002
          type: string
          example: 2026-004
        firstName: &id003
          type: string
          example: Ana
        lastName: &id004
          type: string
          example: Reyes
        program: &id005
          type: string
          example: BSIT
        yearLevel: &id006
          type: integer
          minimum: 1
          maximum: 6
          example: 1
        status: &id007
          type: string
          example: Pending
          enum:
          - Pending
          - Enrolled
      required:
      - id
      - studentNumber
      - firstName
      - lastName
      - program
      - yearLevel
      - status
    StudentCreate:
      type: object
      properties: &id008
        studentNumber: *id002
        firstName: *id003
        lastName: *id004
        program: *id005
        yearLevel: *id006
        status: *id007
      required:
      - studentNumber
      - firstName
      - lastName
      - program
      - yearLevel
    StudentUpdate:
      type: object
      properties: *id008
    Course:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 4
        code: &id009
          type: string
          example: IT401
        title: &id010
          type: string
          example: Systems Integration
        program: &id011
          type: string
          example: BSIT
        units: &id012
          type: integer
          minimum: 1
          maximum: 12
          example: 3
        yearLevel: &id013
          type: integer
          minimum: 1
          maximum: 6
          example: 4
      required:
      - id
      - code
      - title
      - program
      - units
      - yearLevel
    CourseCreate:
      type: object
      properties: &id014
        code: *id009
        title: *id010
        program: *id011
        units: *id012
        yearLevel: *id013
      required:
      - code
      - title
      - program
      - units
      - yearLevel
    CourseUpdate:
      type: object
      properties: *id014
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 3
        studentId: &id015
          type: integer
          minimum: 1
          example: 3
        academicYear: &id016
          type: string
          example: 2026-2027
        semester: &id017
          type: string
          example: 2nd Semester
          enum:
          - 1st Semester
          - 2nd Semester
          - Summer
        status:
          type: string
          example: Pending
          enum:
          - Pending
          - Approved
          - Rejected
      required:
      - id
      - studentId
      - academicYear
      - semester
      - status
    EnrollmentCreate:
      type: object
      properties:
        studentId: *id015
        academicYear: *id016
        semester: *id017
      required:
      - studentId
      - academicYear
      - semester
    EnrollmentStatusUpdate:
      type: object
      properties:
        status:
          type: string
          example: Approved
          enum:
          - Pending
          - Approved
          - Rejected
      required:
      - status
    AcademicRecord:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 3
        studentId: *id015
        courseId: &id018
          type: integer
          minimum: 1
          example: 1
        academicYear: *id016
        semester: *id017
        grade: &id019
          type: number
          minimum: 1
          maximum: 5
          example: 1.75
      required:
      - id
      - studentId
      - courseId
      - academicYear
      - semester
      - grade
    AcademicRecordCreate:
      type: object
      properties: &id020
        studentId: *id015
        courseId: *id018
        academicYear: *id016
        semester: *id017
        grade: *id019
      required:
      - studentId
      - courseId
      - academicYear
      - semester
      - grade
    AcademicRecordUpdate:
      type: object
      properties: *id020
